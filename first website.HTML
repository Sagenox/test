<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="bootstrap.css" />
    <script src="bootstrap5.js"></script>
    <script src="jquery.js"></script>
    <style>
      .calculator {
        width: 50%;
        height: 80%;
        margin-left: 20%;
      }
      .heading {
        width: 30%;
        margin-left: 33%;
        margin-top: 2%;
      }
      #display {
        font-size: 60px;
      }
      h1:hover {
        color: black;
      }
    </style>
    <script>
      $(document).ready(function () {
        var x;
        x = $("#display").text();
        $("#btn1").click(function () {
          i = $("#btn1").val();
          x = x + i;
          $("#display").text(x);
        });

        $("#btn2").click(function () {
          i = $("#btn2").val();
          x = x + i;
          $("#display").text(x);
        });

        $("#btn3").click(function () {
          i = $("#btn3").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btn4").click(function () {
          i = $("#btn4").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btn5").click(function () {
          i = $("#btn5").val();
          x = x + i;

          $("#display").text(x);
        });
        $("#btn6").click(function () {
          i = $("#btn6").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btn7").click(function () {
          i = $("#btn7").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btn8").click(function () {
          i = $("#btn8").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btn9").click(function () {
          i = $("#btn9").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btn0").click(function () {
          i = $("#btn0").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btn00").click(function () {
          i = $("#btn00").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btndot").click(function () {
          i = $("#btndot").val();
          x = x + i;
          $("#display").text(x);
        });
        $("#btnplus").click(function () {
          y = $("#display").text();
          x = "0";
          $("#display").text(x);
          x = $("#display").text();
          $("#btnequal").click(function () {
            z = parseFloat(y) + parseFloat(x);
            $("#display").text(z);
          });
        });
        $("#btnminus").click(function () {
          y = $("#display").text();
          x = "0";
          $("#display").text(x);
          x = $("#display").text();
          $("#btnequal").click(function () {
            z = parseFloat(y) - parseFloat(x);
            $("#display").text(z);
          });
        });
        $("#btndiv").click(function () {
          y = $("#display").text();
          x = "0";
          $("#display").text(x);
          x = $("#display").text();
          $("#btnequal").click(function () {
            z = parseFloat(y) / parseFloat(x);
            $("#display").text(z);
          });
        });
        $("#btnmul").click(function () {
          y = $("#display").text();
          x = "0";
          $("#display").text(x);
          x = $("#display").text();
          $("#btnequal").click(function () {
            z = parseFloat(y) * parseFloat(x);
            $("#display").text(z);
          });
        });
        $("#btnac").click(function () {
          x = "0";
          $("#display").text(x);
        });
        $("#btnc").click(function () {
          $("#display").text(x);
        });
        $("#btnper").click(function () {
          y = $("#display").text();
          x = "0";
          $("#display").text(x);
          x = $("#display").text();
          $("#btnequal").click(function () {
            z = (parseFloat(y) / 100) * parseFloat(x);
            $("#display").text(z);
          });
        });
      });
    </script>
  </head>
  <body>

          <div class="col-sm-3 text-center">
